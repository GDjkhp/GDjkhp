name: Metrics (MP3 - YT Music)
on:
  schedule: [{cron: "50 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-mp3-ytmusic:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-mp3-ytmusic.svg
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          output_action: none
          filename: github-metrics-mp3-ytmusic.svg

          user: GDjkhp
          template: classic
          base: ""
          config_timezone: Asia/Manila

          plugin_music: yes
          plugin_music_playlist: >-
            https://music.youtube.com/playlist?list=PLH5sYo3B_zIWfb4WcR6r3yO_SXX140fuH

      - name: collect github-metrics-mp3-ytmusic.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-mp3-ytmusic.svg dist/github-metrics-mp3-ytmusic.svg

      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-mp3-ytmusic/github-metrics-mp3-ytmusic.svg
      - name: push github-metrics-mp3-ytmusic.svg to the metrics-mp3-ytmusic branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-mp3-ytmusic
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
