name: Metrics (Spotify - Anime)
on:
  schedule: [{cron: "35 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-spotify-anime:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-spotify-anime.svg
        uses: gdjkhp/metrics-music-steam-fix@master
        with:
          token: NOT_NEEDED
          output_action: none
          filename: github-metrics-spotify-anime.svg

          user: GDjkhp
          template: classic
          base: ""
          config_timezone: Asia/Manila

          plugin_music: yes
          plugin_music_playlist: https://open.spotify.com/embed/playlist/5gTstMRePD5sF1CPT8hrFV

      - name: collect github-metrics-spotify-anime.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-spotify-anime.svg dist/github-metrics-spotify-anime.svg

      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-spotify-anime/github-metrics-spotify-anime.svg
      - name: push github-metrics-spotify-anime.svg to the metrics-spotify-anime branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-spotify-anime
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
