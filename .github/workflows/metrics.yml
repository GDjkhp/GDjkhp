name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics.svg
        uses: gdjkhp/metrics-music-steam-fix@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Don't commit to the current branch, the render is pushed to `metrics` below
          output_action: none
          filename: github-metrics.svg

          user: GDjkhp
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila

          # Languages activity: Indepth analysis
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15

          # Featured repositories: Pinned repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 6

          # Coding habits and activity: Mildly interesting facts
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no

          # Recent activity: Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, release, fork, review, ref/create

          # Notable contributions: Indepth analysis
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes

          # Recently starred repositories: Recently starred
          plugin_stars: yes
          plugin_stars_limit: 6

          plugin_steam: yes
          plugin_steam_achievements_limit: 6
          plugin_steam_games_limit: 100
          plugin_steam_playtime_threshold: 0
          plugin_steam_recent_games_limit: 10
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: "76561198990615491"
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}

          plugin_music: yes
          plugin_music_limit: 25
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: lastfm
          plugin_music_time_range: long
          plugin_music_top_type: tracks
          plugin_music_user: GDjkhp
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}

          plugin_anilist: yes
          plugin_anilist_limit: 1000
          plugin_anilist_limit_characters: 1000
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_shuffle: yes
          plugin_anilist_user: GDjkhp

      # the action writes its render to /metrics_renders when output_action is none
      - name: collect github-metrics.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics.svg dist/github-metrics.svg

      # push the content of <build_dir> to a branch
      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics/github-metrics.svg
      - name: push github-metrics.svg to the metrics branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}