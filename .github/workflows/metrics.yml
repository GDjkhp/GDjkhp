name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: GDjkhp
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila

          plugin_anilist: yes
          plugin_anilist_limit: 1000
          plugin_anilist_limit_characters: 1000
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_shuffle: yes
          plugin_anilist_user: GDjkhp

          plugin_music: yes
          plugin_music_limit: 1000
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: lastfm
          plugin_music_time_range: long
          plugin_music_top_type: tracks
          plugin_music_user: GDjkhp
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}

          plugin_steam: yes
          plugin_steam_achievements_limit: 100
          plugin_steam_games_limit: 100
          plugin_steam_playtime_threshold: 0
          plugin_steam_recent_games_limit: 10
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: 76561198990615491
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
