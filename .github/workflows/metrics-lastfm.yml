name: Metrics (Last.fm)
on:
  # Schedule daily updates
  schedule: [{cron: "20 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-lastfm:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-lastfm.svg
        uses: gdjkhp/metrics-music-steam-fix@master
        with:
          token: NOT_NEEDED

          # Don't commit to the current branch, the render is pushed to `metrics-lastfm` below
          output_action: none
          filename: github-metrics-lastfm.svg

          user: GDjkhp
          template: classic
          # Disable every base section so only the music plugin is rendered
          base: ""
          config_timezone: Asia/Manila

          plugin_music: yes
          plugin_music_limit: 100
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: lastfm
          plugin_music_time_range: long
          plugin_music_top_type: tracks
          plugin_music_user: GDjkhp
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}

      # the action writes its render to /metrics_renders when output_action is none
      - name: collect github-metrics-lastfm.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-lastfm.svg dist/github-metrics-lastfm.svg

      # push the content of <build_dir> to a branch
      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-lastfm/github-metrics-lastfm.svg
      - name: push github-metrics-lastfm.svg to the metrics-lastfm branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-lastfm
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
