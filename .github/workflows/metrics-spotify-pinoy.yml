name: Metrics (Spotify - Pinoy)
on:
  schedule: [{cron: "45 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-spotify-pinoy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-spotify-pinoy.svg
        uses: gdjkhp/metrics-music-steam-fix@master
        with:
          token: NOT_NEEDED
          output_action: none
          filename: github-metrics-spotify-pinoy.svg

          user: GDjkhp
          template: classic
          base: ""
          config_timezone: Asia/Manila

          plugin_music: yes
          plugin_music_limit: 25
          plugin_music_playlist: https://open.spotify.com/embed/playlist/2KJXVkIuvtKUrs1Awxqm8Y

      - name: collect github-metrics-spotify-pinoy.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-spotify-pinoy.svg dist/github-metrics-spotify-pinoy.svg

      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-spotify-pinoy/github-metrics-spotify-pinoy.svg
      - name: push github-metrics-spotify-pinoy.svg to the metrics-spotify-pinoy branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-spotify-pinoy
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
