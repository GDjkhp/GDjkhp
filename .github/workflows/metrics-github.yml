name: Metrics (GitHub)
on:
  # Schedule daily updates
  schedule: [{cron: "30 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-github:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-github.svg
        uses: gdjkhp/metrics-music-steam-fix@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Don't commit to the current branch, the render is pushed to `metrics-github` below
          output_action: none
          filename: github-metrics-github.svg

          user: GDjkhp
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila

          # Languages activity: Indepth analysis
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15

          # Featured repositories: Pinned repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 6

          # Coding habits and activity: Mildly interesting facts
          # plugin_habits: yes
          # plugin_habits_facts: yes
          # plugin_habits_charts: no

          # Recent activity: Recent activity
          # plugin_activity: yes
          # plugin_activity_limit: 5
          # plugin_activity_days: 0
          # plugin_activity_filter: issue, pr, release, fork, review, ref/create

          # Notable contributions: Indepth analysis
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes

          # Recently starred repositories: Recently starred
          plugin_stars: yes
          plugin_stars_limit: 6

      # the action writes its render to /metrics_renders when output_action is none
      - name: collect github-metrics-github.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-github.svg dist/github-metrics-github.svg

      # push the content of <build_dir> to a branch
      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-github/github-metrics-github.svg
      - name: push github-metrics-github.svg to the metrics-github branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-github
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
