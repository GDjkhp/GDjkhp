name: Metrics (MP3 - Spotify)
on:
  schedule: [{cron: "55 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-mp3-spotify:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-mp3-spotify.svg
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          output_action: none
          filename: github-metrics-mp3-spotify.svg

          user: GDjkhp
          template: classic
          base: ""
          config_timezone: Asia/Manila

          plugin_music: yes
          plugin_music_playlist: https://open.spotify.com/embed/playlist/64EfDyiUHoW0us6BTg86cq

      - name: collect github-metrics-mp3-spotify.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-mp3-spotify.svg dist/github-metrics-mp3-spotify.svg

      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-mp3-spotify/github-metrics-mp3-spotify.svg
      - name: push github-metrics-mp3-spotify.svg to the metrics-mp3-spotify branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-mp3-spotify
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
