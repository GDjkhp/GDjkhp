name: Metrics (YT Music - Anime)
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics-ytmusic-anime:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-ytmusic-anime.svg
        uses: gdjkhp/metrics-music-steam-fix@master
        with:
          token: NOT_NEEDED
          output_action: none
          filename: github-metrics-ytmusic-anime.svg

          user: GDjkhp
          template: classic
          base: ""
          config_timezone: Asia/Manila

          plugin_music: yes
          plugin_music_limit: 25
          plugin_music_playlist: >-
            https://music.youtube.com/playlist?list=PLH5sYo3B_zIWRYKF8qwoOQMx8ysH9wSkv

      - name: collect github-metrics-ytmusic-anime.svg
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics-ytmusic-anime.svg dist/github-metrics-ytmusic-anime.svg

      # available at https://raw.githubusercontent.com/GDjkhp/GDjkhp/metrics-ytmusic-anime/github-metrics-ytmusic-anime.svg
      - name: push github-metrics-ytmusic-anime.svg to the metrics-ytmusic-anime branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-ytmusic-anime
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
